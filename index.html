
<!doctype html>
<html lang="lv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mēles — Reed Log</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#6b4226">

<style>
  :root { font-family: system-ui, sans-serif; background:#faf6ef; color:#292524; }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; }
  .wrap { max-width:480px; margin:0 auto; }
  h1 { font-size:20px; margin:0; }
  .sub { font-size:12px; color:#78716c; }
  .tabs { display:flex; gap:4px; margin:12px 0 0; }
  .tabs button { flex:1; padding:8px 4px; border:1px solid #d6d3d1; background:#fff; border-radius:10px; font-size:13px; cursor:pointer; }
  .tabs button.on { background:#f59e0b; color:#fff; border-color:#b45309; font-weight:600; }
  .tabs.second { margin:4px 0 12px; }
  .card { background:#fff; border:1px solid #e7e5e4; border-radius:16px; padding:16px; margin-bottom:12px; box-shadow:0 1px 2px rgba(0,0,0,.05); max-width:100%; overflow-wrap:break-word; }
  .card * { max-width:100%; }
  .stamp { flex-wrap:wrap; gap:4px; }
  .txt, .sub, .mchip, .pill { overflow-wrap:anywhere; }
  .chips { max-width:100%; }
  button, .chip, .mchip { white-space:normal; }
  .bigbtn { display:flex; align-items:center; gap:14px; width:100%; text-align:left; padding:20px; border:2px solid #d6d3d1; border-radius:16px; background:#fff; cursor:pointer; font-size:16px; margin-bottom:10px; }
  .bigbtn:hover { border-color:#f59e0b; background:#fffbeb; }
  .bigbtn .ico { font-size:32px; }
  .bigbtn .desc { font-size:12px; color:#78716c; font-weight:400; }
  label { font-size:13px; font-weight:600; display:block; margin:10px 0 4px; }
  input, select, textarea { width:100%; padding:8px; border:1px solid #d6d3d1; border-radius:8px; font-size:14px; background:#fff; font-family:inherit; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .rate { display:grid; grid-template-columns:repeat(10,1fr); gap:4px; margin:4px 0 8px; }
  .rate button { padding:8px 0; border:1px solid #d6d3d1; border-radius:8px; background:#fff; font-weight:600; cursor:pointer; font-size:13px; }
  .rate button.on { background:#f59e0b; color:#fff; border-color:#b45309; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0; }
  .chip { padding:6px 12px; border:1px solid #d6d3d1; border-radius:999px; background:#fff; font-size:13px; cursor:pointer; }
  .chip.on { background:#f59e0b; color:#fff; border-color:#b45309; }
  .primary { width:100%; padding:12px; background:#f59e0b; color:#fff; border:none; border-radius:10px; font-size:15px; font-weight:600; cursor:pointer; margin-top:12px; }
  .primary:disabled { background:#d6d3d1; cursor:default; }
  .pill { font-size:11px; padding:2px 8px; border-radius:999px; border:1px solid; display:inline-block; max-width:100%; }
  .chips .pill { flex:0 1 auto; min-width:0; }
  .s-testēšanā { background:#dbeafe; color:#1e40af; border-color:#93c5fd; }
  .s-aktīva { background:#dcfce7; color:#166534; border-color:#86efac; }
  .s-rezerve { background:#fef3c7; color:#92400e; border-color:#fcd34d; }
  .s-salauzta { background:#fee2e2; color:#991b1b; border-color:#fca5a5; }
  .s-nolietota { background:#f5f5f4; color:#57534e; border-color:#d6d3d1; }
  .mchip { font-size:12px; background:#fffbeb; border:1px solid #fcd34d; border-radius:999px; padding:2px 8px; cursor:pointer; }
  .entry { border-bottom:1px solid #f5f5f4; padding:8px 0; }
  .entry:last-child { border:0; }
  .stamp { font-size:10px; color:#a8a29e; display:flex; justify-content:space-between; }
  .txt { font-size:12px; color:#44403c; margin-top:2px; }
  .star { font-size:10px; font-weight:700; color:#b45309; background:#fffbeb; border:1px solid #fcd34d; border-radius:999px; padding:1px 7px; }
  pre { font-size:11px; background:#292524; color:#fef3c7; border-radius:10px; padding:12px; overflow:auto; white-space:pre-wrap; }
  .spark { vertical-align:middle; margin-left:6px; }
  .matchrow { display:flex; justify-content:space-between; align-items:center; background:#fff; border:1px solid #fcd34d; border-radius:10px; padding:6px 10px; margin-top:6px; font-size:13px; }
  .note { font-size:11px; color:#a8a29e; margin-top:6px; }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#292524; color:#fff; padding:10px 20px; border-radius:999px; font-size:13px; display:none; z-index:50; }
  .syncbar { position:fixed; bottom:0; left:0; right:0; background:#fee2e2; color:#991b1b; padding:10px 16px; font-size:13px; font-weight:600; display:none; z-index:49; text-align:center; cursor:pointer; }
</style>

<body>
<div class="wrap">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <div>
      <h1>🎵 Mēles — Reed Log</h1>
      <div class="sub" id="subtitle">Fagots/Mēles/Reeds</div>
    </div>
    <button class="chip" onclick="go('settings')">⚙️</button>
  </div>
  <div class="tabs">
    <button id="t-sakums" onclick="go('sakums')">🏠 Sākums</button>
    <button id="t-log" onclick="go('log')">⚡ Log</button>
    <button id="t-play" onclick="go('play')">🎡 Break-in</button>
    <button id="t-new" onclick="go('new')">+ Jauna</button>
    <button id="t-lib" onclick="go('library')">Bibliotēka</button>
  </div>
  <div class="tabs second">
    <button id="t-diag" onclick="go('diag')">🩺 Diagnoze</button>
    <button id="t-stats" onclick="go('stats')">📊 Statistika</button>
  </div>
  <div id="app"></div>
  <div class="sub" style="text-align:center;margin-top:24px">Saglabā tavā Obsidian vaultā · Fagots/Mēles/Reeds · <span id="ver">v48</span></div>
</div>
<div class="toast" id="toast"></div>
<div class="syncbar" id="syncbar" onclick="this.style.display='none'"></div>

<script>
// ---------------- config (localStorage) ----------------
const CFG_KEY = "reedlog_cfg";
const cfg = Object.assign({ token: "", owner: "Meisswindu", repo: "obsidian-domas-utt", dir: "Fagots/Mēles/Reeds", branch: "main" }, JSON.parse(localStorage.getItem(CFG_KEY) || "{}"));
const saveCfg = () => localStorage.setItem(CFG_KEY, JSON.stringify(cfg));

const CANE_PREFIX = { "Lavoro":"L", "Danzi":"D", "Rigotti":"R", "Glotin":"G", "Alliaud":"A", "Rieger":"V", "Normunds (kolēģis)":"NZ" };
const METODES = ["Mateo","vārīšana"];
const STATUSES = ["testēšanā","aktīva","rezerve","salauzta","nolietota"];
const MM_POINTS = ["T","2","4","8","12","16","20","24","L"];
const normPoint = (p) => String(p).toLowerCase().replace(/mm/g,"").replace("beigas","l").replace("tip","t").trim();

// ---------------- data ----------------
const LS_KEY = "reedlog_data";
let reeds = JSON.parse(localStorage.getItem(LS_KEY) || "null") || [
  { reed_id:"L001", datums:"2026-07-29", shape:"9", cane_manufacturer:"Lavoro", cane_hardness:"", wire_gauge:"copper, steel, steel", tip_profiler_setting:"", status:"testēšanā", saistīts_ar:"", reitings_sākumā:5, reitings_tagad:7, m:[], log:[
    { stamp:"2026-08-01", rating:null, text:"Mī nedaudz nestabils. Nav crispy. Paspēlēju garās notis." },
    { stamp:"2026-08-13 12:18", rating:6, text:"Nogriezu galu, lai ir 28 spals. nedaudz mī vēl nestabils, bet ir daudz labāk." },
    { stamp:"2026-08-15 11:59", rating:4, text:"Šodien šķiet diezgan mushy un neflexa. pēc mērījumiem par smagu." } ] },
  { reed_id:"L004", datums:"2026-07-30", shape:"9", cane_manufacturer:"Lavoro", cane_hardness:"", wire_gauge:"", tip_profiler_setting:"0.5", status:"testēšanā", saistīts_ar:"", reitings_sākumā:7, reitings_tagad:"", m:[{point:"Tip",left:38,right:37},{point:"2mm",left:51,right:51},{point:"4mm",left:59,right:57},{point:"8mm",left:78,right:76}], log:[
    { stamp:"2026-08-13 13:17", rating:null, text:"Pievilku abas drātis. pēc pievilkšanas šķiet smaga. nē, ir forša pat pēc drātim." },
    { stamp:"2026-08-13 20:06", rating:null, text:"Izspēlēju Clark divās oktāvās, Bišku neflexa un apakšas par augstu, bet ir ok." } ] },
  { reed_id:"D001", datums:"2026-08-20", shape:"9", cane_manufacturer:"Danzi", cane_hardness:"hard", wire_gauge:"07 Rieger", tip_profiler_setting:"0.5", status:"aktīva", saistīts_ar:"", reitings_sākumā:6, reitings_tagad:8, m:[], log:[
    { stamp:"2026-08-22", rating:null, text:"Labākā koncertmēle pagaidām. Stabila visa oktāva." } ] },
];
const persist = () => localStorage.setItem(LS_KEY, JSON.stringify(reeds));
// maker (izgatavotājs): who MADE the reed — Pauls by default, NZ-* are Normunds'; cane_manufacturer stays the cane brand
const MAKERS = ["Pauls", "Normunds", "Artis"];
const defaultMaker = r => { if (!r.maker) r.maker = /^NZ/i.test(r.reed_id || "") ? "Normunds" : "Pauls"; };
reeds.forEach(defaultMaker);

// ---------------- backup export / import ----------------
function exportBackup() {
  const payload = { app: "reed-log", version: document.getElementById("ver")?.textContent || "", exported: new Date().toISOString(), reeds, cfg: { owner: cfg.owner, repo: cfg.repo, dir: cfg.dir, branch: cfg.branch } };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "reed-log-backup-" + new Date().toISOString().slice(0, 10) + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  toast("💾 Rezerves kopija lejupielādēta");
}
function importBackup(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!Array.isArray(data.reeds) || !data.reeds.length) throw new Error("nav derīgs reed-log backups");
      const mergeReed = (incoming) => {
        const local = reeds.find(x => x.reed_id === incoming.reed_id);
        if (!local) return incoming; // new reed: take it
        // both exist: keep whichever has the newer last log stamp / edited marker
        const stamp = r => r.log && r.log.length ? String(r.log[r.log.length - 1].stamp) : "";
        return stamp(incoming) > stamp(local) ? incoming : local;
      };
      const merged = data.reeds.map(mergeReed);
      // keep local-only reeds too
      for (const l of reeds) if (!merged.find(x => x.reed_id === l.reed_id)) merged.push(l);
      reeds = merged;
      reeds.forEach(defaultMaker);
      persist(); render();
      toast("✅ Backups importēts (" + merged.length + " mēles, pa jaunākajiem ierakstiem apvienots)");
    } catch (e) { toast("❌ Imports neizdevās: " + e.message); }
  };
  reader.readAsText(file);
}

// ---------------- helpers ----------------
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c]));
const today = () => new Date().toISOString().slice(0,10);
const nowStamp = () => { const d = new Date(), p = n => String(n).padStart(2,"0"); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };

function nextReedId(manufacturer) {
  const prefix = CANE_PREFIX[manufacturer] || (manufacturer || "X").slice(0,1).toUpperCase();
  const nums = reeds.map(r => /^([A-Z]+)(\d+)$/.exec(String(r.reed_id).trim())).filter(Boolean).filter(m => m[1] === prefix).map(m => parseInt(m[2],10));
  return prefix + String((nums.length ? Math.max(...nums) : 0) + 1).padStart(3,"0");
}

function reedToMarkdown(r) {
  const fm = [
    "---","tags:","  - reed",
    `reed_id: "${r.reed_id}"`,
    `datums: ${r.datums}`,
    `maker: "${r.maker || "Pauls"}"`,
    r.tube_length && `tube_length: "${r.tube_length}"`,
    r.blade_length && `blade_length: "${r.blade_length}"`,
    r.shape && `shape: "${r.shape}"`,
    r.cane_manufacturer && `cane_manufacturer: ${r.cane_manufacturer}`,
    r.metode && `metode: ${r.metode}`,
    r.cane_hardness && `cane_hardness: "${r.cane_hardness}"`,
    r.wire_1 && `wire_1: ${r.wire_1}`,
    r.wire_2 && `wire_2: ${r.wire_2}`,
    r.wire_3 && `wire_3: ${r.wire_3}`,
    r.tip_profiler_setting && `tip_profiler_setting: "${r.tip_profiler_setting}"`,
    `status: ${r.status}`,
    r.saistīts_ar && `saistīts_ar: ${r.saistīts_ar}`,
    r.reitings_sākumā && `reitings_sākumā: "${r.reitings_sākumā}"`,
    r.reitings_tagad && `reitings_tagad: "${r.reitings_tagad}"`,
    r.e_nestabila === "jā" && `e_nestabila: "jā"`,
    r.e_nestabila === "jā" && r.e_pakape && `e_nestabilitates_pakape: "${r.e_pakape}"`,
    "---"
  ].filter(Boolean).join("\n");
  const meas = r.m.length ? "\n" + r.m.map(row => `${row.point} - ${row.left}, ${row.right}`).join("\n") + "\n" : "";
  const measHist = (r.meas_log || []).map(h => `${h.stamp}: ${h.changes.map(c => `${c.point} ${c.side === "left" ? "1. puse" : "2. puse"} ${c.from}→${c.to}`).join("; ")}`).join("\n");
  const eHist = (r.e_log || []).map(h => `${h.stamp}: E ${h.from} → ${h.to}`).join("\n");
  const fHist = (r.field_log || []).map(h => `${h.stamp}: ${h.changes.map(c => `${c.k} ${c.from}→${c.to}`).join("; ")}`).join("\n");
  const log = r.log.map(e => `${e.stamp}\n\n${e.rating ? `**Reitings: ${e.rating}/10**\n\n` : ""}${e.text}`).join("\n\n");
  const comments = (r.comments || []).map(c => `${c.stamp} — ${c.text}`).join("\n");
  return fm + "\n## Mērījumi \n" + meas + (measHist || fHist ? "\n### Vēsture\n" + [measHist, fHist].filter(Boolean).join("\n") + "\n" : "") + "\n## Testēšana \n" + (eHist ? "\n" + eHist + "\n" : "") + "\n## Piezīmes \n" + (comments ? "\n" + comments + "\n" : "") + "\n## Log\n" + (log ? "\n" + log + "\n" : "");
}

function ratingHistory(r) { const h = []; if (r.reitings_sākumā) h.push(r.reitings_sākumā); r.log.forEach(e => e.rating && h.push(e.rating)); if (r.reitings_tagad && String(r.reitings_tagad) !== String(h[h.length-1] ?? "")) h.push(r.reitings_tagad); return h; }

// ---------------- statistics ----------------
function statAvg(arr) { const a = arr.filter(x => typeof x === "number" && !isNaN(x)); return a.length ? a.reduce((s,v)=>s+v,0)/a.length : null; }
function statsMinutesVsRating() {
  // per reed: total play-in minutes vs current rating — does playing-in improve reeds?
  return reeds.filter(r => (r.log||[]).some(e => /(iespēlēšanās|break-in)/i.test(e.text||"")) && r.reitings_tagad !== "" && r.reitings_tagad != null)
    .map(r => ({ id: r.reed_id, mins: minutesPlayed(r), rating: parseFloat(r.reitings_tagad) }))
    .filter(x => !isNaN(x.rating));
}
function statsByGroup(key) {
  // avg current rating + count by a frontmatter key (metode, shape, cane_hardness…)
  const groups = {};
  for (const r of reeds) {
    const k = String(r[key] || "").trim();
    if (!k || k === "-") continue;
    if (r.reitings_tagad === "" || r.reitings_tagad == null) continue;
    const v = parseFloat(r.reitings_tagad);
    if (isNaN(v)) continue;
    (groups[k] = groups[k] || []).push(v);
  }
  return Object.entries(groups).map(([k, arr]) => ({ k, n: arr.length, avg: arr.reduce((s,v)=>s+v,0)/arr.length }))
    .sort((a,b) => b.avg - a.avg);
}
function statsEOverTime() {
  // E pakāpe trajectory per reed from e_log (chronic fix tracking)
  return reeds.filter(r => (r.e_log||[]).length > 1).map(r => ({
    id: r.reed_id,
    points: r.e_log.map(e => ({ stamp: e.stamp, to: e.to }))
  }));
}
function statsMinsByDay() {
  // play-in minutes per calendar day (last 14 days with data)
  const byDay = {};
  for (const r of reeds) for (const e of (r.log||[])) {
    const m = /(iespēlēšanās|break-in)\s+([\d.,]+)\s*min/i.exec(e.text || "");
    if (m) { const d = String(e.stamp).slice(0,10); byDay[d] = (byDay[d] || 0) + parseFloat(m[2].replace(",", ".")); }
  }
  return Object.entries(byDay).sort((a,b) => a[0].localeCompare(b[0])).slice(-14);
}
function getM(r, point) {
  const row = (r.m || []).find(x => normPoint(x.point) === normPoint(point));
  if (!row) return null;
  const l = parseFloat(row.left), rt = parseFloat(row.right);
  if (isNaN(l) || isNaN(rt)) return null;
  return { l, r: rt, diff: Math.abs(l - rt) };
}
function corrStats() {
  // group reeds by E stability; collect 4mm/16mm diffs
  const groups = { unstable: [], stable: [], unrated: [] };
  reeds.forEach(r => {
    if (r.e_nestabila === "jā") groups.unstable.push(r);
    else if (r.e_nestabila === "nē") groups.stable.push(r);
    else groups.unrated.push(r);
  });
  const collect = (arr, p) => {
    const vals = arr.map(r => getM(r, p)).filter(Boolean);
    if (!vals.length) return null;
    const avg = k => (vals.reduce((s, v) => s + v[k], 0) / vals.length);
    return { n: vals.length, diff: avg("diff"), l: avg("l"), r: avg("r") };
  };
  return {
    unstable: groups.unstable.length, stable: groups.stable.length, unrated: groups.unrated.length,
    mm4: { unstable: collect(groups.unstable, "4"), stable: collect(groups.stable, "4") },
    mm16: { unstable: collect(groups.unstable, "16"), stable: collect(groups.stable, "16") },
  };
}
const WIRE_OPTS = { 1: ["copper","6","7"], 2: ["6","7","steel"], 3: ["6","6 dubultā","7","7 dubultā","steel"] };
function wireChipsNew(n) {
  return `<div class="chips" style="margin-top:4px">${WIRE_OPTS[n].map(v => `<button class="chip" style="font-size:11px;padding:2px 8px" onclick="newForm.wire_${n}='${v.replace(/'/g,"\\'")}';render()">${v}</button>`).join("")}</div>`;
}
function profilePlot(r) {
  const pts = MM_POINTS.filter(p => (r.m || []).some(x => normPoint(x.point) === normPoint(p)));
  if (pts.length < 2) return "";
  const xs = pts.map((p, i) => 10 + i * ((300 - 20) / (pts.length - 1)));
  const all = pts.map(p => r.m.find(x => normPoint(x.point) === normPoint(p)));
  const maxV = Math.max(...all.flatMap(row => [Number(row.left) || 0, Number(row.right) || 0]), 1);
  const y = v => 90 - (v / maxV) * 78;
  const path = side => pts.map((p, i) => `${i ? "L" : "M"}${xs[i]},${y(Number(all[i][side]) || 0)}`).join(" ");
  const ok = side => pts.map((p, i) => (all[i][side] !== "" && all[i][side] !== undefined ? `${i ? "L" : "M"}${xs[i]},${y(Number(all[i][side]))}` : "")).filter(Boolean).join(" ");
  return `<div style="margin-top:10px">
    <svg viewBox="0 0 300 110" style="width:100%;max-width:420px;background:#fafaf9;border:1px solid #e7e5e4;border-radius:8px">
      ${[0,0.25,0.5,0.75,1].map(t => `<line x1="10" x2="290" y1="${12 + t*78}" y2="${12 + t*78}" stroke="#eee" stroke-width="1"/>`).join("")}
      ${(() => { const TGT = { "4":55, "8":65, "12":70, "16":80, "20":85, "24":90 }; const tp = pts.map((p, i) => (TGT[String(p).trim()] !== undefined ? `${xs[i]},${y(TGT[String(p).trim()])}` : null)).filter(Boolean); return tp.length >= 2 ? `<path d="M${tp.join(" L")}" fill="none" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="3 4" opacity="0.8"/>` : ""; })()}
      <path d="${ok("left")}" fill="none" stroke="#1d4ed8" stroke-width="2.2"/>
      <path d="${ok("right")}" fill="none" stroke="#ea580c" stroke-width="2.2" stroke-dasharray="5 3"/>
      ${xs.map((x, i) => `<text x="${x}" y="104" text-anchor="middle" font-size="8" fill="#78716c">${pts[i]}</text>`).join("")}
      ${all.map((row, i) => `<circle cx="${xs[i]}" cy="${y(Number(row.left) || 0)}" r="2.5" fill="#1d4ed8"/>`).join("")}
      ${all.map((row, i) => row.right !== "" ? `<circle cx="${xs[i]}" cy="${y(Number(row.right))}" r="2.5" fill="#ea580c"/>` : "").join("")}
    </svg>
    <div style="font-size:10px;color:#78716c;margin-top:4px">
      <span style="color:#1d4ed8">━ 1. puse</span> &nbsp; <span style="color:#ea580c">╌╌ 2. puse</span> · T (tips) pa kreisi, L (spals) pa labi — kalna profils
    </div>
  </div>`;
}

function corrRow(label, d) {

}
function lastEditStamp(r) {
  if (!r.log || !r.log.length) return r.datums || "";

}
function sortedForLibrary() {

  return [...reeds].sort((a,b) => rank(a.status) - rank(b.status) || String(lastEditStamp(b)).localeCompare(String(lastEditStamp(a))) || a.reed_id.localeCompare(b.reed_id));

function sparkline(values) {
  if (values.length < 2) return "";
  const w=100, h=24, pts = values.map((v,i)=>`${(i/(values.length-1))*w},${h-(v/10)*h}`).join(" ");
  return `<svg class="spark" width="${w}" height="${h}"><polyline points="${pts}" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${w}" cy="${h-(values[values.length-1]/10)*h}" r="2.5" fill="#b45309"/></svg>`;
}

// ---------------- GitHub API ----------------
async function gh(path, opts = {}) {
  if (!cfg.token) throw new Error("Nav ievadīts GitHub token (⚙️ iestatījumi)");
  const { headers = {}, ...rest } = opts;
  const res = await fetch(`https://api.github.com${path}`, {
    ...rest,
    headers: {
      "Authorization": `Bearer ${cfg.token}`,
      "Accept": "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28",
      ...headers,
    }
  });
  if (!res.ok) { const t = await res.text(); throw new Error(`GitHub ${res.status}: ${t.slice(0,200)}`); }
  return res.json();
}

// encode each path segment but keep the slashes
const encPath = (p) => p.split("/").map(encodeURIComponent).join("/");

const ghQueue = {}; // per-path serialization: prevents concurrent PUTs racing on sha
async function commitFile(path, content, message) {
  const prev = ghQueue[path] || Promise.resolve();
  const run = prev.catch(() => {}).then(async () => {
    const put = async () => {
      let sha = null;
      try { const ex = await gh(`/repos/${cfg.owner}/${cfg.repo}/contents/${encPath(path)}?ref=${encodeURIComponent(cfg.branch)}`); sha = ex.sha; } catch (e) { /* new file */ }
      await gh(`/repos/${cfg.owner}/${cfg.repo}/contents/${encPath(path)}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message, content: btoa(unescape(encodeURIComponent(content))), sha, branch: cfg.branch })
      });
    };
    try { await put(); }
    catch (e) {
      if (String(e.message).includes("409")) { await put(); } // sha raced: refetch once and retry
      else throw e;
    }
  });
  ghQueue[path] = run.catch(() => {});
  await run;
}

async function pullFromGithub() {
  const dirPath = cfg.dir.split("/").map(encodeURIComponent).join("/");
  const dir = await gh(`/repos/${cfg.owner}/${cfg.repo}/contents/${dirPath}?ref=${cfg.branch}`);
  const files = dir.filter(x => x.name.endsWith(".md"));
  // fetch all notes in parallel (batches of 10 to stay API-polite)
  const out = [];
  for (let i = 0; i < files.length; i += 10) {
    const batch = await Promise.all(files.slice(i, i + 10).map(async f => {
      try {
        const blob = await gh(`/repos/${cfg.owner}/${cfg.repo}/contents/${encPath(f.path)}?ref=${cfg.branch}`);
        const text = decodeURIComponent(escape(atob(blob.content)));
        return parseReedMarkdown(text, f.name.replace(/\.md$/,""));
      } catch (e) { return null; }
    }));
    batch.filter(Boolean).forEach(r => out.push(r));
  }
  // MERGE by newest log stamp: whichever copy (local vs GitHub) was edited last wins, per reed
  const stampOf = r => r.log && r.log.length ? String(r.log[r.log.length-1].stamp) : "";
  let updated = 0;
  const local = reeds.filter(r => {
    const g = out.find(g => (g._file || g.reed_id + ".md") === (r._file || r.reed_id + ".md"));
    if (!g) return true; // local-only: keep
    if (stampOf(g) > stampOf(r)) updated++; // GitHub newer: GitHub copy replaces local
    return false;
  });
  reeds = [...out, ...local].sort((a,b) => a.reed_id.localeCompare(b.reed_id));
  reeds.forEach(defaultMaker);
  persist();
  return updated;
}

  if (!m) return null;
  const fm = {};
  m[1].split("\n").forEach(line => {
    const kv = line.match(/^(\w+):\s*(.*)$/);
    if (kv) fm[kv[1]] = kv[2].replace(/^"|"$/g,"").trim();
  });
  const body = text.slice(m[0].length);
  const eSec = (body.split(/## Testēšana\s*\n/)[1] || "").split(/## /)[0];
  const e_log = [];
  eSec.split("\n").forEach(line => {
    const em = line.match(/^\s*(\d{4}-\d{2}-\d{2}[ \d:]*):\s*E\s+(.+?)\s*→\s*(.+)$/);
    if (em) e_log.push({ stamp: em[1].trim(), from: em[2].trim(), to: em[3].trim() });
  });
  const logSec = body.split(/## Log\s*\n/)[1] || "";
  const log = [];
  const chunks = logSec.split(/\n(?=\d{4}-\d{2}-\d{2})/).filter(s => s.trim());
  for (const c of chunks) {
    const stamp = (c.match(/\d{4}-\d{2}-\d{2}[ \d:]*/) || [""])[0].trim();
    let rest = c.slice(stamp.length).trim();
    let rating = null;
    const rm = rest.match(/\*\*Reitings:\s*(\d+)\/10\*\*/);
    if (rm) { rating = parseInt(rm[1],10); rest = rest.replace(rm[0],"").trim(); }
    if (stamp) log.push({ stamp, rating, text: rest });
  }
  const measSec = (body.split(/## Mērījumi\s*\n/)[1] || "").split(/## /)[0];
  const meas = [];
  measSec.split("\n").forEach(line => {
    const mm = line.match(/^\s*([\w]+)\s*-\s*(\d+(?:[.,]\d+)?)\s*(?:,\s*(\d+(?:[.,]\d+)?))?/);
    if (mm) meas.push({ point: mm[1], left: mm[2], right: mm[3] || "" });
  });
  const notesSec = (body.split(/## Piezīmes\s*\n/)[1] || "").split(/## /)[0];
  const notes = [];
  notesSec.split("\n").forEach(line => {
    const cm = line.match(/^\s*(\d{4}-\d{2}-\d{2}[ \d:]*)\s*—\s*(.*)/);
    if (cm && cm[2].trim()) notes.push({ stamp: cm[1].trim(), text: cm[2].trim() });
  });
  const histSec = (measSec.split(/### Vēsture\s*\n/)[1] || "");
  const meas_log = [];
  const field_log = [];
  histSec.split("\n").forEach(line => {
    const hm = line.match(/^\s*(\d{4}-\d{2}-\d{2}[ \d:]*):\s*(.+)/);
    if (!hm) return;
    const changes = [];
    const fchanges = [];
    hm[2].split(";").forEach(part => {
      const pm = part.trim().match(/^(\S+)\s+(kreisā|labā|1\. puse|2\. puse)\s+(\S+?)→(\S+)$/);
      if (pm) changes.push({ point: pm[1], side: (pm[2] === "kreisā" || pm[2] === "1. puse") ? "left" : "right", from: pm[3], to: pm[4] });
      const fm2 = part.trim().match(/^(wire_[123]|status|reitings_tagad|reitings_sakumā|metode|tip_profiler_setting)\s+(.+?)→(.+)$/);
      if (fm2) fchanges.push({ k: fm2[1], from: fm2[2], to: fm2[3] });
    });
    if (changes.length) meas_log.push({ stamp: hm[1].trim(), changes });
    if (fchanges.length) field_log.push({ stamp: hm[1].trim(), changes: fchanges });
  });
  const reed = {
    reed_id: fm.reed_id || fallbackId, datums: fm.datums || today(),
    shape: fm.shape || "", maker: fm.maker || "", tube_length: fm.tube_length || "", blade_length: fm.blade_length || "", cane_manufacturer: fm.cane_manufacturer || "", metode: fm.metode || "", cane_hardness: fm.cane_hardness || "",
    wire_gauge: fm.wire_gauge || "", wire_1: fm.wire_1 || "", wire_2: fm.wire_2 || "", wire_3: fm.wire_3 || "", tip_profiler_setting: fm.tip_profiler_setting || "",
    status: fm.status || "testēšanā", saistīts_ar: fm.saistīts_ar || "",
    reitings_sākumā: fm.reitings_sākumā || "", reitings_tagad: fm.reitings_tagad || "",
    e_nestabila: fm.e_nestabila || "", e_pakape: fm.e_nestabilitates_pakape || "",
    m: meas, log, comments: notes, meas_log, field_log, e_log, _file: fallbackId + ".md"
  };
  // migrate legacy "copper, steel, steel" → wire_1/2/3
  if (!reed.wire_1 && !reed.wire_2 && !reed.wire_3 && reed.wire_gauge) {
    const parts = reed.wire_gauge.split(",").map(s => s.trim());
    reed.wire_1 = parts[0] || ""; reed.wire_2 = parts[1] || ""; reed.wire_3 = parts[2] || "";
  }
  // dedupe measurement rows (last one wins)
  const seenM = new Map();
  reed.m.forEach(row => seenM.set(normPoint(row.point), row));
  reed.m = [...seenM.values()].filter(row => String(row.left).trim() !== "" || String(row.right).trim() !== "");
  return reed;
}

function daysSincePlayed(r) {
  if (!r.log || !r.log.length) return 99;
  const last = r.log.map(e => e.stamp).sort().slice(-1)[0];
  const days = (Date.now() - new Date(last.slice(0, 10)).getTime()) / 86400000;
  return Math.max(0, Math.round(days));
}
function minutesPlayed(r) {
  if (!r.log || !r.log.length) return 0;
  return r.log.reduce((sum, e) => {
    const m = /(iespēlēšanās|break-in)\s+([\d.,]+)\s*min/i.exec(e.text || "");
    return sum + (m ? parseFloat(m[2].replace(",", ".")) : 0);
  }, 0);
}
function reedAgeStart(r) {
  // age counts from the first scrape ≈ creation date; fall back to earliest recorded stamp if datums missing
  const stamps = [];
  if (r.datums) stamps.push(String(r.datums));
  if (r.log) r.log.forEach(e => stamps.push(String(e.stamp)));
  if (r.comments) r.comments.forEach(c => stamps.push(String(c.stamp)));
  const dates = stamps.map(s => s.slice(0, 10)).filter(s => /^\d{4}-\d{2}-\d{2}$/.test(s)).sort();
  return dates[0] || null;
}
function reedAge(r, at) {
  const start = reedAgeStart(r);
  const day = String(at || "").slice(0, 10);
  if (!start || !/^\d{4}-\d{2}-\d{2}$/.test(day)) return null;
  const n = Math.round((new Date(day) - new Date(start)) / 86400000);
  return n >= 0 ? n : null;
}

}

function spinWheel() {
  const pool = playPool();
  if (!pool.length) return;
  // weighted pick: longer unplayed AND fewer accumulated minutes = heavier weight
  const mins = pool.map(minutesPlayed);
  const maxM = Math.max(...mins);
  const weights = pool.map((r, i) => Math.pow(daysSincePlayed(r) + 1, 1.5) * (1 + Math.max(0, maxM - mins[i]) / 30));
  const total = weights.reduce((a, b) => a + b, 0);
  let roll = Math.random() * total, chosen = pool[0];
  for (let i = 0; i < pool.length; i++) { roll -= weights[i]; if (roll <= 0) { chosen = pool[i]; break; } }
  // animation: flash through reeds, decelerate, land on chosen
  let i = 0, delay = 50;
  const el = document.getElementById("wheelface");
  const tick = () => {
    el.textContent = pool[i % pool.length].reed_id;
    i++;
    if (delay < 320) { delay += 14; playSpin = setTimeout(tick, delay); }
    else { playPick = chosen.reed_id; playVia = "wheel"; clearTimeout(playSpin); playSpin = null; render(); }
  };
  playPick = null; tick();
}

  const text = `${playVia === "manual" ? "✋" : "🎲"} Break-in ${mins} min${what ? " — " + what : ""}\nSajūtas: ${feel}${subsLine ? "\nVērtējumi: " + subsLine : ""}${eLine ? "\nE stabilitāte: " + eLine : ""}`;
  r.log.push({ stamp: nowStamp(), rating: playRating, text });

  }

  persist(); render(); toast("Iespēlēšanās ierakstīta ✓");

function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.style.display = "block"; setTimeout(() => t.style.display = "none", 2500); }
function syncFail(msg) { const b = document.getElementById("syncbar"); b.textContent = "⚠️ Nav saglabāts GitHub: " + msg + " — spied šeit, lai aizvērtu"; b.style.display = "block"; }
async function pushToGithub(r, what) {
  if (!cfg.token) return;
  const path = `${cfg.dir}/${r._file || r.reed_id + ".md"}`;
  // stale guard: if the GitHub copy is newer than the phone's, warn before overwriting
  try {
    const blob = await gh(`/repos/${cfg.owner}/${cfg.repo}/contents/${encPath(path)}?ref=${encodeURIComponent(cfg.branch)}`);
    const remote = decodeURIComponent(escape(atob(blob.content)));
    const stamps = t => (t.match(/\d{4}-\d{2}-\d{2}( \d{2}:\d{2})?/g) || []).sort().slice(-1)[0] || "";
    const local = r.log && r.log.length ? String(r.log[r.log.length-1].stamp) : "";
    if (stamps(remote) > local) {
      const ok = confirm(`⚠️ GitHub kopija ${r.reed_id}.md ir JAUNĀKA par telefona kopiju.\n(Kopā ārpus telefona kāds ir labojis — piem. Obsidian vai pārlūks.)\n\nTurpināt un pārrakstīt GitHub? (OK = jā, Atcelt = nesaglabā un vispirms spied ⬇️ Ielādēt)`);
      if (!ok) { toast("⏸️ Saglabāšana atcelta — vispirms ielādē no GitHub"); return; }
    }
  } catch (e) { /* file not on GitHub yet: normal, proceed */ }
  commitFile(path, reedToMarkdown(r), `reed log: ${r.reed_id} ${what}`)
    .then(() => toast("Saglabāts GitHub ✓"))
    .catch(e => syncFail(e.message));
}

function similarity(a, b) {
  if (a.reed_id === b.reed_id) return 0;
  let s = 0;
  if (a.cane_manufacturer && a.cane_manufacturer === b.cane_manufacturer) s += 3;
  if (a.shape && a.shape === b.shape) s += 1;
  if (a.tip_profiler_setting && a.tip_profiler_setting === b.tip_profiler_setting) s += 2;
  if (a.wire_1 && a.wire_1 === b.wire_1) s += 1;
  if (a.wire_2 && a.wire_2 === b.wire_2) s += 1;
  if (a.wire_3 && a.wire_3 === b.wire_3) s += 1;
  s += Math.max(0, 4 - Math.abs((parseInt(a.reitings_tagad)||parseInt(a.reitings_sākumā)||0) - (parseInt(b.reitings_tagad)||parseInt(b.reitings_sākumā)||0)));
  return s;
}

function updM(point, side, val) {
  const f = newForm;
  let row = f.m.find(x => normPoint(x.point) === normPoint(point));
  if (!row) { row = { point, left: "", right: "" }; f.m.push(row); }
  row.point = point;
  row[side] = val;
  if (!row.left && !row.right) f.m = f.m.filter(x => normPoint(x.point) !== normPoint(point));
  document.getElementById("prev").textContent = reedToMarkdown(f);
}

function saveToken() { cfg.token = document.getElementById("cfg-token").value.trim(); saveCfg(); toast("Token saglabāts ✓"); render(); }

// ---------------- edit existing reed ----------------
function usedValues(key) {
  const vals = [...new Set(reeds.map(r => String(r[key] || "").trim()).filter(Boolean))];
  return vals;
}
function suggestChips(key) {
  const vals = usedValues(key);
  const r = reeds.find(x => x.reed_id === editTarget);
  const cur = String(r?.[key] || "").trim();
  if (!vals.length) return "";
  return `<div class="chips">${vals.filter(v => v !== cur).map(v => `<button class="chip" onclick="editField('${key}','${v.replace(/'/g,"\\'")}');render()">${esc(v)}</button>`).join("")}</div>`;
}
function editM(point, side, val) {
  const r = reeds.find(x => x.reed_id === editTarget);
  if (!r) return;
  let row = r.m.find(x => normPoint(x.point) === normPoint(point));
  if (!row) { row = { point, left: "", right: "" }; r.m.push(row); }
  row.point = point;
  row[side] = val;
  if (!row.left && !row.right) r.m = r.m.filter(x => normPoint(x.point) !== normPoint(point));
  persist();
}function setE(v) { const r = reeds.find(x => x.reed_id === editTarget); if (!r) return; r.e_nestabila = String(r.e_nestabila) === v ? "" : v; if (r.e_nestabila !== "jā") r.e_pakape = ""; persist(); render(); }
function setEpak(n) { const r = reeds.find(x => x.reed_id === editTarget); if (!r) return; r.e_pakape = String(r.e_pakape) === String(n) ? "" : n; persist(); render(); }
function setNewE(v) { newForm.e_nestabila = String(newForm.e_nestabila) === v ? "" : v; if (newForm.e_nestabila !== "jā") newForm.e_pakape = ""; render(); }
function setNewEpak(n) { newForm.e_pakape = String(newForm.e_pakape) === String(n) ? "" : n; render(); }
function editField(k, v) { const r = reeds.find(x => x.reed_id === editTarget); if (r) { r[k] = v; persist(); } }
function rateReed(n) {
  const r = reeds.find(x => x.reed_id === editTarget); if (!r) return;
  r.reitings_tagad = String(r.reitings_tagad) === String(n) ? "" : n;
  persist(); render();
}
function addEntryToReed() {
  const t = editDraft.trim();
  if (!t) { toast("✍️ Ieraksti tekstu…"); return; }
  if (!entryRating) { toast("⭐ Ievērtē mēli 1–10 — reitings ir svarīgs datam!"); return; }
  const r = reeds.find(x => x.reed_id === editTarget);
  r.log.push({ stamp: nowStamp(), rating: entryRating, text: t });
  r.reitings_tagad = entryRating;
  editDraft = ""; entryRating = 0;
  persist(); render(); toast("Ieraksts pievienots ✓");
  pushToGithub(r, "atjaunināts");
}
function delEntry(i) { const r = reeds.find(x => x.reed_id === editTarget); r.log.splice(i, 1); persist(); render(); }
function addComment() {
  const inp = document.getElementById("newcomment");
  const t = (inp?.value || "").trim();
  if (!t) return;
  const r = reeds.find(x => x.reed_id === editTarget);
  if (!r) return;
  r.comments = r.comments || [];
  r.comments.push({ stamp: nowStamp(), text: t });
  persist(); render(); toast("Piezīme pievienota ✓");
}
function delComment(i) {
  const r = reeds.find(x => x.reed_id === editTarget);
  r.comments.splice(i, 1); persist(); render();
}
function enterEdit(id) {
  editTarget = id; editDraft = "";
  const r = reeds.find(x => x.reed_id === id);
  editBaseline = r ? JSON.parse(JSON.stringify(r.m)) : [];
  editBaselineE = r ? { nest: r.e_nestabila, pak: r.e_pakape } : {};
  editBaselineF = r ? { wire_1: r.wire_1 || "", wire_2: r.wire_2 || "", wire_3: r.wire_3 || "", status: r.status || "", reitings_tagad: String(r.reitings_tagad ?? ""), reitings_sakumā: String(r.reitings_sākumā ?? ""), metode: r.metode || "", tip_profiler_setting: r.tip_profiler_setting || "", maker: r.maker || "Pauls", tube_length: r.tube_length || "", blade_length: r.blade_length || "" } : {};
  view = "edit"; render();
}
function saveEdit() {
  const r = reeds.find(x => x.reed_id === editTarget);
  if (!r) { view = "library"; render(); return; }
  // dedupe measurement rows (case/variant spellings of same point; last one wins)
  const seen = new Map();
  (r.m || []).forEach(row => seen.set(normPoint(row.point), row));
  r.m = [...seen.values()].filter(row => String(row.left).trim() !== "" || String(row.right).trim() !== "");
  // harvest any uncommitted text so 💾 never discards what's on screen
  const pendingNote = (document.getElementById("newcomment")?.value || "").trim();
  if (pendingNote) { r.comments = r.comments || []; r.comments.push({ stamp: nowStamp(), text: pendingNote }); toast("💬 Piezīme pievienota ✓"); }
  const pendingLog = (typeof editDraft === "string" ? editDraft : "").trim() || (document.getElementById("editlog")?.value || "").trim();
  if (pendingLog) { r.log.push({ stamp: nowStamp(), rating: null, text: pendingLog }); editDraft = ""; toast("📝 Ieraksts pievienots ✓"); }
  // diff measurements against entry baseline → record change history (real changes only)
  const changes = [];
  r.m.forEach(row => {
    const old = (editBaseline || []).find(b => normPoint(b.point) === normPoint(row.point)) || {};
    ["left","right"].forEach(side => {
      const from = String(old[side] ?? "").trim(), to = String(row[side] ?? "").trim();
      if (from !== to && to !== "" && from !== "")  // record only real value changes
        changes.push({ point: normPoint(row.point), side, from, to });
      else if (from !== to && to !== "" && from === "") // newly filled in
        changes.push({ point: normPoint(row.point), side, from: "–", to });
    });
  });
  if (changes.length) {
    r.meas_log = r.meas_log || [];
    r.meas_log.push({ stamp: nowStamp(), changes });
    toast(`📏 ${changes.length} mērījumu izmaiņas saglabātas vēsturē ✓`);
  }
  // E-stability change history
  const eDesc = (nest, pak) => nest === "jā" ? `nestabils${pak ? " (" + pak + "/10)" : ""}` : (nest === "nē" ? "stabils" : "nav vērtēts");
  const eBefore = eDesc(editBaselineE?.nest ?? "", editBaselineE?.pak ?? "");
  const eAfter = eDesc(r.e_nestabila ?? "", r.e_pakape ?? "");
  if (eBefore !== eAfter) {
    r.e_log = r.e_log || [];
    r.e_log.push({ stamp: nowStamp(), from: eBefore, to: eAfter });
    toast("🎵 E stabilitātes izmaiņa pierakstīta vēsturē ✓");
  }
  // Field-change history (wires, status, ratings, TP setting, metode)
  const F_LABELS = FIELD_LABELS;
  const fChanges = [];
  Object.keys(F_LABELS).forEach(k => {
    const from = String(editBaselineF?.[k] ?? ""), to = String(r[k] ?? "");
    if (from !== to && (from || to)) fChanges.push({ k, from: from || "–", to: to || "–" });
  });
  if (fChanges.length) {
    r.field_log = r.field_log || [];
    r.field_log.push({ stamp: nowStamp(), changes: fChanges });
    toast(`🔧 ${fChanges.map(c => F_LABELS[c.k] + ": " + c.from + " → " + c.to).join(" · ")} — pierakstīts vēsturē ✓`);
  }
  persist(); toast("Izmaiņas saglabātas ✓");
  view = "library"; render();
  pushToGithub(r, "labots");
}
function saveSettings() {
  cfg.token = document.getElementById("cfg-token").value.trim();
  cfg.repo = document.getElementById("cfg-repo").value.trim();
  cfg.dir = document.getElementById("cfg-dir").value.trim();
  cfg.branch = document.getElementById("cfg-branch").value.trim();
  saveCfg(); toast("Saglabāts ✓"); view = "sakums"; render();
}
async function doPull() {
  try { toast("Ielādēju…"); const up = await pullFromGithub(); toast(`Ielādētas ${reeds.length} mēles ✓${up ? " · " + up + " atjauninātas no GitHub" : " · telefona kopijas bija jaunākās"}`); render(); }
  catch (e) { syncFail(e.message); }
}

async function testConnection() {
  const box = document.getElementById("testresult");
  const log = (ok, msg) => { box.style.display = "block"; box.innerHTML += (ok ? "✅ " : "❌ ") + esc(msg) + "\n"; };
  box.style.display = "block"; box.innerHTML = "";
  if (!cfg.token) { log(false, "Nav token. Ievadi token ⚙️ sadaļā."); return; }
  log(true, "Token ir (" + cfg.token.slice(0, 7) + "…)");
  try {
    const repo = await gh(`/repos/${cfg.owner}/${cfg.repo}`);
    log(true, `Repo atrasts: ${repo.full_name} (${repo.private ? "privāts" : "publisks"})`);
  } catch (e) { log(false, "Repo nav pieejams ar šo token: " + e.message); return; }
  try {
    const dirPath = cfg.dir.split("/").map(encodeURIComponent).join("/");
    const dir = await gh(`/repos/${cfg.owner}/${cfg.repo}/contents/${dirPath}?ref=${cfg.branch}`);
    log(true, `Mape "${cfg.dir}" nolasīta — ${dir.filter(f=>f.name.endsWith(".md")).length} .md faili`);
  } catch (e) { log(false, "Mapi nevar nolasīt (pārbaudiet ceļu/branch): " + e.message); return; }
  try {
    const testPath = `${cfg.dir}/_test_${Date.now()}.md`;
    await commitFile(testPath, "test", "reed log: connection test");
    log(true, "Rakstīšana strādā — izveidoju un dzēšu testa failu");
    const sha = (await gh(`/repos/${cfg.owner}/${cfg.repo}/contents/${encPath(testPath)}`)).sha;
    await gh(`/repos/${cfg.owner}/${cfg.repo}/contents/${encPath(testPath)}`, { method: "DELETE", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: "reed log: cleanup test", sha, branch: cfg.branch }) });
    log(true, "Testa fails izdzēsts ✓ — viss strādā!");
  } catch (e) {
    log(false, "RAKSTĪŠANA NEDARBĒJAS: " + e.message);
    log(false, "Visticamāk: token nav \"Contents: Read and write\" atļauja. github.com → Settings → Developer settings → jūsu tokens → Repository permissions → Contents = Read and write.");
  }
}

render();
</script>
